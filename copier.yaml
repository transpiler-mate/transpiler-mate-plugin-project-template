_min_copier_version: "9.0.0"
_subdirectory: "template"
_templates_suffix: ".jinja"

_message_after_copy: |
  Project {{ project_name }} has been generated.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    cp .env.example .env
    hatch env create
    task quality

project_name:
  type: str
  help: Human-readable project name
  default: "My Transpiler-Mate Plugin"

project_slug:
  type: str
  help: Repository/package distribution name, e.g. my-python-project
  default: "{{ project_name|lower|replace(' ', '-')|replace('_', '-') }}"

python_package:
  type: str
  help: Importable Python package name, e.g. my_python_project
  default: "{{ project_slug|replace('-', '_') }}"

project_description:
  type: str
  help: One-line project description
  default: "{{ project_name }} Transpiler-Mate Plugin."

author_name:
  type: str
  help: Author or organization name
  default: "Terraude"

author_email:
  type: str
  help: Author contact email
  default: "info@terradue.com"

repository_url:
  type: str
  help: GitHub repository URL
  default: "https://github.com/Transpiler-Mate/{{ project_slug }}"

documentation_url:
  type: str
  help: Published documentation URL
  default: "https://Transpiler-Mate.github.io/{{ project_slug }}/"

copyright_year:
  type: str
  help: Copyright year
  default: "2026"
